name: Sync with Upstream

on:
  schedule:
    # Exécution automatique hebdomadaire (tous les lundis à 04:00 UTC)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Forcer la synchronisation même si aucun nouveau commit n'est détecté"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  workflows: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync, Test & Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Check upstream for changes
        id: check-upstream
        run: |
          UPSTREAM_URL="https://github.com/avivsinai/bitbucket-cli.git"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          SYNC_BRANCH="sync-upstream"

          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --tags

          BEHIND_COUNT=$(git rev-list --count "origin/$DEFAULT_BRANCH..upstream/$DEFAULT_BRANCH")
          echo "Nombre de nouveaux commits en amont : $BEHIND_COUNT"

          if [ "$BEHIND_COUNT" -eq 0 ] && [ "${{ inputs.force_sync }}" != "true" ]; then
            echo "Le dépôt est déjà parfaitement synchronisé avec upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "behind_count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        if: steps.check-upstream.outputs.has_changes == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH="${{ steps.check-upstream.outputs.default_branch }}"
          SYNC_BRANCH="${{ steps.check-upstream.outputs.sync_branch }}"

          echo "Création de la branche dédiée $SYNC_BRANCH depuis origin/$DEFAULT_BRANCH..."
          git checkout -B "$SYNC_BRANCH" "origin/$DEFAULT_BRANCH"

          echo "Tentative de fusion d'upstream/$DEFAULT_BRANCH..."
          if ! git merge --no-edit upstream/"$DEFAULT_BRANCH" -m "chore(sync): merge upstream/$DEFAULT_BRANCH into $SYNC_BRANCH"; then
            echo "::error::Conflit de fusion détecté lors de la synchronisation avec upstream."
            git merge --abort || true
            git checkout -B "$SYNC_BRANCH" upstream/"$DEFAULT_BRANCH"
            git push origin "$SYNC_BRANCH" --force

            # Alerte par Issue
            EXISTING_ISSUE=$(gh issue list --search "[Sync Upstream] Conflit de fusion" --state open --json number --jq '.[0].number')
            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create \
                --title "⚠️ [Sync Upstream] Conflit de fusion avec le dépôt d'origine" \
                --body "La synchronisation automatique avec **upstream ($DEFAULT_BRANCH)** a rencontré des conflits de fusion non résolus.<br><br>👉 La branche dédiée \`$SYNC_BRANCH\` a été mise à jour avec l'état upstream.<br>Une résolution manuelle est requise avant de pouvoir fusionner sur \`$DEFAULT_BRANCH\`."
            fi
            exit 1
          fi

      - name: Run non-regression tests
        if: steps.check-upstream.outputs.has_changes == 'true'
        id: test
        env:
          BKT_OAUTH_CLIENT_ID: ci-oauth-client-id
          BKT_OAUTH_CLIENT_SECRET: ci-oauth-client-secret # gitleaks:allow
        run: |
          echo "=== 1. Vérification des skills ==="
          make check-skills

          echo "=== 2. Vérification des generated skills ==="
          make check-generated-skill

          echo "=== 3. Vérification des contrats de release ==="
          ./scripts/check-oauth-release-contract.sh
          ./scripts/check-homebrew-formula-test.sh
          ./scripts/check-winget-release-contract.sh

          echo "=== 4. Vérification du formatage Go ==="
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Les fichiers suivants nécessitent gofmt :" >&2
            echo "$files" >&2
            exit 1
          fi

          echo "=== 5. Go vet ==="
          go vet ./...

          echo "=== 6. Tests unitaires ==="
          go test -v ./...

          echo "=== 7. Compilation ==="
          make build

      - name: Handle test failure (Alert user)
        if: failure() && steps.check-upstream.outputs.has_changes == 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH="${{ steps.check-upstream.outputs.default_branch }}"
          SYNC_BRANCH="${{ steps.check-upstream.outputs.sync_branch }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Tests en échec. Sauvegarde de la branche $SYNC_BRANCH sur origin pour analyse..."
          git push origin "$SYNC_BRANCH" --force

          # Créer une PR pour faciliter l'inspection du code et des régressions
          PR_EXISTS=$(gh pr list --head "$SYNC_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "⚠️ [Sync Upstream] Échec des tests de non-régression" \
              --body "De nouveaux commits ont été récupérés depuis upstream, mais les tests de régression ont échoué.<br><br>🔍 **Workflow Run** : [Voir les logs]($RUN_URL)<br>🌱 **Branche** : \`$SYNC_BRANCH\`<br><br>Merci d'intervenir pour corriger les régressions avant la fusion vers \`$DEFAULT_BRANCH\`."
          fi

          # Créer une issue d'alerte si non existante
          EXISTING_ISSUE=$(gh issue list --search "[Sync Upstream] Échec des tests" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "⚠️ [Sync Upstream] Échec des tests de non-régression" \
              --body "La synchronisation automatique a détecté de nouveaux commits en amont, mais les tests de non-régression ont échoué sur \`$SYNC_BRANCH\`.<br><br>Consultez les détails du job : [Workflow Run]($RUN_URL)."
          fi

      - name: Auto-merge to main/master on test success
        if: steps.check-upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH="${{ steps.check-upstream.outputs.default_branch }}"
          SYNC_BRANCH="${{ steps.check-upstream.outputs.sync_branch }}"

          echo "✅ Tous les tests sont passés avec succès !"
          echo "Mise à jour de la branche dédiée $SYNC_BRANCH sur origin..."
          git push origin "$SYNC_BRANCH" --force

          echo "Fusion automatique vers $DEFAULT_BRANCH..."
          git checkout "$DEFAULT_BRANCH"
          git merge "$SYNC_BRANCH" --no-edit -m "chore(sync): automated sync with upstream ($DEFAULT_BRANCH)"
          git push origin "$DEFAULT_BRANCH"

          echo "Synchronisation des tags..."
          git push origin --tags || true

          # Nettoyer les issues d'alerte précédentes si résolues
          EXISTING_ISSUES=$(gh issue list --search "[Sync Upstream]" --state open --json number --jq '.[].number')
          for issue in $EXISTING_ISSUES; do
            gh issue close "$issue" --comment "Synchronisation réussie avec succès par le workflow automatique."
          done

          echo "🎉 Synchronisation et fusion terminées avec succès sans aucune intervention humaine."
